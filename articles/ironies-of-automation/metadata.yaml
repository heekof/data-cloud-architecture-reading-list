  experiment.
personal_description: null
ai_summary: L'automatisation retire aux opérateurs une partie de la pratique qui
  entretient leurs compétences, puis compte sur eux pour reprendre la main dans
  les situations les plus difficiles. Une supervision efficace exige donc de
  préserver la compréhension du système, le contexte de l'incident et
  l'entraînement aux interventions rares.
