ai_summary: The Software Architect Elevator explique qu'un bon architecte fait
  le lien entre la stratégie de l'entreprise et la réalité technique. Il ne
  cherche pas à prendre toutes les décisions, mais aide les équipes à prendre
  les bonnes en rendant visibles les contraintes et les compromis. Sa valeur
  vient de sa capacité à changer de niveau, traduire entre dirigeants et
  ingénieurs, et transformer la technologie en véritable levier pour
  l'entreprise.
