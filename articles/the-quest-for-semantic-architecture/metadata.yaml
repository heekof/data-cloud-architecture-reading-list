ai_summary: Partager un catalogue ou un format de données ne garantit pas une
  compréhension commune. L'auteur propose de gérer les concepts métier, leurs
  définitions et leurs relations indépendamment des outils, puis de les relier
  explicitement aux objets de données pour préserver leur sens au-delà des
  frontières techniques.
