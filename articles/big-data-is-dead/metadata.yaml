note: >
  Jordan Tigani (2023). Former BigQuery director arguing that most organisations
  don't have big data, and the distributed architecture they bought for it is
  overhead. Worth reading adversarially — he's also selling DuckDB — but the
  empirical claim about query size distributions is the interesting part, and
  his 2026 follow-up tests it against the Redshift fleet dataset.
