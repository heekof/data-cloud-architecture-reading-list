  - id: big-data-is-dead
    title: "Big Data is Dead"
    url: "https://motherduck.com/blog/big-data-is-dead/"
    category: data-architecture
    rating: null
    note: >
      Jordan Tigani (2023). Former BigQuery director arguing that most organisations don't have big data, and the distributed architecture they bought for it is overhead. Worth reading adversarially — he's also selling DuckDB — but the empirical claim about query size distributions is the interesting part, and his 2026 follow-up tests it against the Redshift fleet dataset.
    personal_description: null

  - id: designing-data-intensive-applications
    title: "Designing Data-Intensive Applications"
    url: null
    category: foundations
    rating: 8
    note: "Martin Kleppmann (2017). The reference book on replication, partitioning, transactions, consistency, batch and stream processing."
    personal_description: null
    ai_summary: "Le livre de référence sur les systèmes de données : réplication, partitionnement, transactions, cohérence, batch et stream. Complète The Log, Immutability et Out of the Tar Pit."

  - id: mapreduce-simplified-data-processing
    title: "MapReduce: Simplified Data Processing on Large Clusters"
    url: "https://static.googleusercontent.com/media/research.google.com/en//archive/mapreduce-osdi04.pdf"
    category: foundations
    rating: null
    note: "Jeff Dean & Sanjay Ghemawat (OSDI 2004). Foundational paper on distributed data processing."
    personal_description: null
    ai_summary: "Le papier fondateur de Google sur le traitement de données distribué : diviser le travail en map et reduce, exécuter en parallèle sur des milliers de machines. La base de tout le big data moderne."

  - id: apache-iceberg-definitive-guide
    title: "Apache Iceberg: The Definitive Guide"
    url: null
    category: data-governance
    rating: null
    note: "Apache Iceberg. Open table format for huge datasets with schema evolution, partitioning, and time travel."
    personal_description: null
    ai_summary: "Format de table ouvert conçu pour les très gros datasets : évolution de schéma, partitionnement caché, time travel. Central dans le débat Databricks/Snowflake et les catalog wars."

  - id: data-mesh
    title: "Data Mesh"
    url: null
    category: data-architecture
    rating: 7
    note: "Zhamak Dehghani (2022). Domain-oriented data ownership, data as a product, self-serve platform, federated governance."
    personal_description: null
    ai_summary: "Alternative au monolithe data : chaque domaine possède ses données comme un produit, une plateforme self-serve, et une gouvernance fédérée. Dialogue directement avec les catalog wars et la gouvernance centralisée vs distribuée."

  - id: site-reliability-engineering
    title: "Site Reliability Engineering"
    url: null
    category: cloud-architecture
    rating: null
    note: "Google SRE. Error budgets, SLIs/SLOs, incident management, postmortems, toil reduction."
    personal_description: null
    ai_summary: "Comment Google gère la fiabilité : error budgets, SLIs/SLOs, postmortems blâmeless, réduction du toil. Le pendant pratique des principes de résilience vus dans Cloud Native Platforms."

  - id: the-architect-elevator
    title: "The Architect Elevator"
    url: null
    category: cloud-architecture
    rating: null
    note: "Gregor Hohpe (2020). Connecting executive vision with technical decisions — the architect as a translator between strategy and implementation."
    personal_description: null
    ai_summary: "The Software Architect Elevator explique qu'un bon architecte fait le lien entre la stratégie de l'entreprise et la réalité technique. Il ne cherche pas à prendre toutes les décisions, mais aide les équipes à prendre les bonnes en rendant visibles les contraintes et les compromis. Sa valeur vient de sa capacité à changer de niveau, traduire entre dirigeants et ingénieurs, et transformer la technologie en véritable levier pour l'entreprise."

  - id: delta-lake-acid-table-storage
